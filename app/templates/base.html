<!DOCTYPE html>
<html lang="zh-CN" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title | default('智能股票深度分析') }}{% endblock %}</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50:'#eff6ff', 100:'#dbeafe', 500:'#3b82f6', 600:'#2563eb', 700:'#1d4ed8', 800:'#1e40af', 900:'#1e3a5f' },
                        accent: { 400:'#fbbf24', 500:'#f59e0b', 600:'#d97706' },
                        rise: '#ef4444',
                        fall: '#22c55e',
                    }
                }
            }
        }
    </script>

    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script>
        // 配置 HTMX 正确处理 UTF-8 编码
        htmx.config.defaultEncoding = 'utf-8';
        htmx.config.ajaxWithCredentials = false;
        // 确保请求参数正确编码
        document.body.addEventListener('htmx:configRequest', function(event) {
            // 强制使用 UTF-8 编码
            event.detail.parameters = Object.fromEntries(
                Object.entries(event.detail.parameters).map(([key, value]) => [
                    key, 
                    typeof value === 'string' ? encodeURIComponent(value) : value
                ])
            );
        });
    </script>

    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>

    <!-- 自定义样式 -->
    <style>
        /* 数字等宽 */
        .tabular-nums { font-variant-numeric: tabular-nums; }
        /* 涨跌颜色 */
        .text-rise { color: #ef4444; }
        .text-fall { color: #22c55e; }
        .bg-rise { background-color: #ef4444; }
        .bg-fall { background-color: #22c55e; }
        /* 卡片悬浮效果 */
        .card-hover { transition: transform 0.25s cubic-bezier(.4,0,.2,1), box-shadow 0.25s cubic-bezier(.4,0,.2,1), border-color 0.25s ease; border: 1px solid transparent; }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -12px rgba(0,0,0,0.12), 0 4px 12px -2px rgba(0,0,0,0.06); border-color: #e2e8f0; }
        /* 渐变标题 */
        .gradient-text { background: linear-gradient(135deg, #1e3a5f, #2563eb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        /* 骨架屏 */
        .skeleton { background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%); background-size: 200% 100%; animation: shimmer 1.5s infinite; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        /* 加载动画 - 脉冲效果 */
        .loading-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        
        /* 加载动画 - 旋转 */
        .loading-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        
        /* 加载动画 - 弹跳 */
        .loading-bounce { animation: bounce 1s infinite; }
        @keyframes bounce { 0%, 100% { transform: translateY(-25%); animation-timing-function: cubic-bezier(0.8,0,1,1); } 50% { transform: translateY(0); animation-timing-function: cubic-bezier(0,0,0.2,1); } }
        
        /* 加载动画 - 渐变呼吸 */
        .loading-breathe { animation: breathe 2s ease-in-out infinite; }
        @keyframes breathe { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        
        /* 进度条动画 */
        .progress-bar { background: linear-gradient(90deg, #3b82f6 0%, #2563eb 50%, #3b82f6 100%); background-size: 200% 100%; animation: progress-move 1.5s ease-in-out infinite; }
        @keyframes progress-move { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
        
        /* 数字滚动动画 */
        .number-roll { display: inline-block; transition: transform 0.3s ease; }
        
        /* 淡入动画 */
        .fade-in { animation: fadeIn 0.6s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 图表渐入 */
        .chart-fade-in { animation: chartFadeIn 0.8s ease-out; }
        @keyframes chartFadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* 涨跌脉冲 */
        .pulse-rise { animation: pulseRise 0.6s ease; }
        @keyframes pulseRise { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        .pulse-fall { animation: pulseFall 0.6s ease; }
        @keyframes pulseFall { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        
        /* Tab 切换过渡 */
        .tab-transition { animation: tabSlideIn 0.3s ease; }
        @keyframes tabSlideIn { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: translateX(0); } }
        
        /* 按钮交互反馈 */
        .btn-press { transition: transform 0.1s ease; }
        .btn-press:active { transform: scale(0.95); }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body class="h-full bg-gray-50 text-gray-800 antialiased">
    <!-- 全局加载遮罩 -->
    <div id="global-loading-overlay" class="hidden fixed inset-0 bg-black bg-opacity-30 z-50 flex items-center justify-center">
        <div class="bg-white rounded-lg p-8 shadow-2xl">
            <div class="flex flex-col items-center space-y-4">
                <div class="relative w-16 h-16">
                    <div class="absolute inset-0 border-4 border-primary-200 rounded-full"></div>
                    <div class="absolute inset-0 border-4 border-primary-600 rounded-full border-t-transparent loading-spin"></div>
                </div>
                <div class="text-primary-600 font-medium loading-breathe">加载中...</div>
            </div>
        </div>
    </div>

    <!-- 顶部导航 -->
    <nav class="bg-gradient-to-r from-primary-900 to-primary-700 shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-12 sm:h-14">
                <!-- Logo -->
                <a href="/" class="flex items-center space-x-2">
                    <span class="text-xl sm:text-2xl">📊</span>
                    <span class="text-white font-bold text-sm sm:text-lg">深度分析</span>
                </a>
                <!-- 导航链接 -->
                <div class="flex items-center space-x-4 sm:space-x-6">
                    <a href="/" class="text-primary-100 hover:text-white text-xs sm:text-sm font-medium transition">首页</a>
                    <a href="/watchlist" class="text-primary-100 hover:text-white text-xs sm:text-sm font-medium transition">自选股</a>
                    <a href="/compare" class="text-primary-100 hover:text-white text-xs sm:text-sm font-medium transition">对比PK</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 py-4 sm:py-6">
        {% block content %}{% endblock %}
    </main>

    <!-- 页脚 -->
    <footer class="border-t border-gray-200 bg-white mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-4 text-center text-xs text-gray-400">
            智能股票深度分析平台 · 数据仅供参考，不构成投资建议
        </div>
    </footer>

    <!-- 全局 JS -->
    <script src="/static/js/app.js"></script>
    <script src="/static/js/watchlist.js" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
