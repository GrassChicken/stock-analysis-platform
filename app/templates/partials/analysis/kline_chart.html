<!-- K线图 - 骨架屏 -->
<div id="kline-skeleton" class="lg:col-span-2 bg-white rounded-xl shadow-sm p-5">
    <div class="flex items-center justify-between mb-3">
        <div class="h-4 bg-gray-200 rounded w-20 skeleton"></div>
        <div class="flex space-x-2">
            <div class="h-6 bg-gray-200 rounded w-12 skeleton"></div>
            <div class="h-6 bg-gray-200 rounded w-12 skeleton"></div>
            <div class="h-6 bg-gray-200 rounded w-12 skeleton"></div>
        </div>
    </div>
    <div class="h-80 bg-gray-200 rounded skeleton"></div>
    <div class="h-4 bg-gray-200 rounded w-48 mx-auto mt-2 skeleton"></div>
</div>

<!-- K线图 - 实际内容（初始隐藏） -->
<div id="kline-content" class="lg:col-span-2 bg-white rounded-xl shadow-sm p-5 hidden">
    <div class="flex items-center justify-between mb-3">
        <h3 class="text-xs sm:text-sm font-semibold text-gray-500">K线走势</h3>
        <div class="flex space-x-1">
            <button class="kline-period btn-press px-2 sm:px-3 py-1 text-xs rounded bg-primary-500 text-white" data-period="daily">日K</button>
            <button class="kline-period btn-press px-2 sm:px-3 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-period="weekly">周K</button>
            <button class="kline-period btn-press px-2 sm:px-3 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-period="monthly">月K</button>
        </div>
    </div>
    
    <!-- 主图指标按钮 -->
    <div class="flex items-center justify-between mb-2">
        <div class="flex space-x-1">
            <button class="ma-toggle btn-press px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-ma="5">MA5</button>
            <button class="ma-toggle btn-press px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-ma="10">MA10</button>
            <button class="ma-toggle btn-press px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-ma="20">MA20</button>
            <button class="ma-toggle btn-press px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-ma="60">MA60</button>
            <button class="boll-toggle btn-press px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200">BOLL</button>
            <button class="chips-toggle btn-press px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200">筹码</button>
        </div>
    </div>
    
    <!-- 图表容器（含筹码统计面板） -->
    <div id="kline-chart-area" class="relative w-full h-80 sm:h-96 lg:h-[28rem]">
        <div id="kline-chart" class="w-full h-full"></div>
        <!-- 筹码统计面板（开启筹码时显示，absolute 覆盖副图右侧区域） -->
        <div id="chips-stats-panel" class="hidden absolute right-1 w-[calc(35%-10px)] flex flex-col px-2 py-2 text-xs text-gray-600 pointer-events-auto overflow-y-auto select-none bg-white rounded-lg border border-gray-200"></div>
    </div>
    
    <!-- 副图控制区域 -->
    <div class="mt-2 space-y-1">
        <!-- 副图1 + 双副图开关 -->
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-1">
                <span class="text-xs text-gray-400 mr-1">副图1:</span>
                <button class="sub-indicator btn-press px-2 py-1 text-xs rounded bg-primary-500 text-white" data-indicator="volume">成交量</button>
                <button class="sub-indicator btn-press px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-indicator="macd">MACD</button>
                <button class="sub-indicator btn-press px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-indicator="kdj">KDJ</button>
                <button class="sub-indicator btn-press px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-indicator="rsi">RSI</button>
            </div>
            <button id="dual-sub-toggle" class="btn-press px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200 flex items-center space-x-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path>
                </svg>
                <span>双副图</span>
            </button>
        </div>
        
        <!-- 副图2（默认隐藏） -->
        <div id="sub-indicator-2-wrapper" class="hidden flex items-center space-x-1">
            <span class="text-xs text-gray-400 mr-1">副图2:</span>
            <button class="sub-indicator-2 btn-press px-2 py-1 text-xs rounded bg-primary-500 text-white" data-indicator="macd">MACD</button>
            <button class="sub-indicator-2 btn-press px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-indicator="kdj">KDJ</button>
            <button class="sub-indicator-2 btn-press px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-indicator="rsi">RSI</button>
            <button class="sub-indicator-2 btn-press px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-indicator="volume">成交量</button>
        </div>
    </div>
    
    <div id="data-hint" class="mt-2 text-xs text-gray-400 text-center"></div>
</div>
