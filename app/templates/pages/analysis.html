{% extends "base.html" %}

{% block content %}
<div class="space-y-6">

    <!-- 股票头部信息 - 骨架屏 -->
    <div id="header-skeleton" class="bg-white rounded-xl shadow-sm p-6">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="flex-1 w-full sm:w-auto">
                <div class="h-8 bg-gray-200 rounded w-48 mb-2 skeleton"></div>
                <div class="h-4 bg-gray-200 rounded w-32 skeleton"></div>
            </div>
            <div class="text-right w-full sm:w-auto">
                <div class="h-10 bg-gray-200 rounded w-24 mb-2 sm:ml-auto skeleton"></div>
                <div class="h-4 bg-gray-200 rounded w-20 sm:ml-auto skeleton"></div>
            </div>
        </div>
    </div>

    <!-- 股票头部信息 - 实际内容（初始隐藏） -->
    <div id="stock-header" class="bg-white rounded-xl shadow-sm p-4 sm:p-6 hidden">
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div class="flex-1 w-full sm:w-auto">
                <h1 id="stock-name" class="text-xl sm:text-2xl font-bold text-gray-800">{{ stock_code }}</h1>
                <p id="stock-industry" class="text-xs sm:text-sm text-gray-500 mt-1">--</p>
            </div>
            <div class="text-right w-full sm:w-auto">
                <div id="stock-price" class="text-2xl sm:text-3xl lg:text-4xl font-bold tabular-nums">--</div>
                <div id="stock-change" class="text-xs sm:text-sm tabular-nums">-- (--%)</div>
            </div>
        </div>
    </div>

    <!-- 综合评分 + K线图 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

        <!-- 左: 综合评分 - 骨架屏 -->
        <div id="score-skeleton" class="bg-white rounded-xl shadow-sm p-5">
            <div class="h-4 bg-gray-200 rounded w-24 mb-4 skeleton"></div>
            <div class="text-center py-6">
                <div class="h-16 bg-gray-200 rounded w-32 mx-auto mb-3 skeleton"></div>
                <div class="h-6 bg-gray-200 rounded w-20 mx-auto mb-4 skeleton"></div>
                <div class="space-y-2">
                    <div class="h-3 bg-gray-200 rounded skeleton"></div>
                    <div class="h-3 bg-gray-200 rounded skeleton"></div>
                    <div class="h-3 bg-gray-200 rounded skeleton"></div>
                </div>
            </div>
            <div class="h-48 bg-gray-200 rounded skeleton"></div>
        </div>

        <!-- 左: 综合评分 - 实际内容（初始隐藏） -->
        <div id="score-content" class="bg-white rounded-xl shadow-sm p-5 card-hover hidden">
            <h3 class="text-sm font-semibold text-gray-500 mb-3">综合评分</h3>
            <div class="text-center py-6">
                <div id="total-score" class="text-4xl sm:text-5xl font-bold gradient-text tabular-nums">--</div>
                <div id="rating-badge" class="mt-2 inline-block px-3 py-1 rounded-full bg-gray-100 text-gray-500 text-sm font-semibold">
                    评级: --
                </div>
                <div id="score-breakdown" class="mt-4 space-y-2 text-xs text-gray-500"></div>
            </div>
            <!-- 五维雷达图 -->
            <div id="radar-chart" class="w-full h-40 sm:h-48"></div>
        </div>

        <!-- 右: K线图 - 骨架屏 -->
        <div id="kline-skeleton" class="lg:col-span-2 bg-white rounded-xl shadow-sm p-5">
            <div class="flex items-center justify-between mb-3">
                <div class="h-4 bg-gray-200 rounded w-20 skeleton"></div>
                <div class="flex space-x-2">
                    <div class="h-6 bg-gray-200 rounded w-12 skeleton"></div>
                    <div class="h-6 bg-gray-200 rounded w-12 skeleton"></div>
                    <div class="h-6 bg-gray-200 rounded w-12 skeleton"></div>
                </div>
            </div>
            <div class="h-80 bg-gray-200 rounded skeleton"></div>
            <div class="h-4 bg-gray-200 rounded w-48 mx-auto mt-2 skeleton"></div>
        </div>

        <!-- 右: K线图 - 实际内容（初始隐藏） -->
        <div id="kline-content" class="lg:col-span-2 bg-white rounded-xl shadow-sm p-5 hidden">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-xs sm:text-sm font-semibold text-gray-500">K线走势</h3>
                <div class="flex space-x-1">
                    <button class="kline-period btn-press px-2 sm:px-3 py-1 text-xs rounded bg-primary-500 text-white" data-period="daily">日K</button>
                    <button class="kline-period btn-press px-2 sm:px-3 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-period="weekly">周K</button>
                    <button class="kline-period btn-press px-2 sm:px-3 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200" data-period="monthly">月K</button>
                </div>
            </div>
            <div id="kline-chart" class="w-full h-64 sm:h-72 lg:h-80"></div>
            <div id="data-hint" class="mt-2 text-xs text-gray-400 text-center"></div>
        </div>
    </div>

    <!-- 分析维度 Tab -->
    <div class="bg-white rounded-xl shadow-sm">
        <div class="border-b border-gray-200">
            <nav class="flex overflow-x-auto scrollbar-hide">
                <button class="tab-btn btn-press px-3 sm:px-5 py-3 text-xs sm:text-sm font-medium text-primary-600 border-b-2 border-primary-600 whitespace-nowrap" data-tab="fundamental">基本面</button>
                <button class="tab-btn btn-press px-3 sm:px-5 py-3 text-xs sm:text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap" data-tab="technical">技术面</button>
                <button class="tab-btn btn-press px-3 sm:px-5 py-3 text-xs sm:text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap" data-tab="valuation">估值面</button>
                <button class="tab-btn btn-press px-3 sm:px-5 py-3 text-xs sm:text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap" data-tab="dupont">杜邦分析</button>
                <button class="tab-btn btn-press px-3 sm:px-5 py-3 text-xs sm:text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap" data-tab="capital">资金面</button>
                <button class="tab-btn btn-press px-3 sm:px-5 py-3 text-xs sm:text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap" data-tab="industry">行业面</button>
                <button class="tab-btn btn-press px-3 sm:px-5 py-3 text-xs sm:text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap" data-tab="ai">🤖 AI 分析</button>
            </nav>
        </div>
        <div id="tab-content" class="p-5">
            <!-- Tab骨架屏 -->
            <div id="tab-skeleton">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="h-4 bg-gray-200 rounded w-24 mb-3 skeleton"></div>
                        <div class="space-y-2">
                            <div class="h-3 bg-gray-200 rounded skeleton"></div>
                            <div class="h-3 bg-gray-200 rounded skeleton"></div>
                            <div class="h-3 bg-gray-200 rounded skeleton"></div>
                        </div>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="h-4 bg-gray-200 rounded w-24 mb-3 skeleton"></div>
                        <div class="space-y-2">
                            <div class="h-3 bg-gray-200 rounded skeleton"></div>
                            <div class="h-3 bg-gray-200 rounded skeleton"></div>
                            <div class="h-3 bg-gray-200 rounded skeleton"></div>
                        </div>
                    </div>
                    <div class="bg-gray-50 rounded-lg p-4">
                        <div class="h-4 bg-gray-200 rounded w-24 mb-3 skeleton"></div>
                        <div class="space-y-2">
                            <div class="h-3 bg-gray-200 rounded skeleton"></div>
                            <div class="h-3 bg-gray-200 rounded skeleton"></div>
                            <div class="h-3 bg-gray-200 rounded skeleton"></div>
                        </div>
                    </div>
                </div>
            </div>
            <div id="tab-body" class="hidden"></div>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/charts.js"></script>
<script>
    const STOCK_CODE = '{{ stock_code }}';
    let radarChart, klineChart;

    document.addEventListener('DOMContentLoaded', function() {
        // 骨架屏初始化时显示，内容区域隐藏
        // 图表在内容显示后初始化

        // 响应式（图表初始化后绑定）

        // 加载数据
        loadAllData();

        // Tab 切换
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => {
                    b.classList.remove('text-primary-600', 'border-b-2', 'border-primary-600');
                    b.classList.add('text-gray-500');
                });
                this.classList.add('text-primary-600', 'border-b-2', 'border-primary-600');
                this.classList.remove('text-gray-500');
                loadTabContent(this.dataset.tab);
            });
        });

        // K线周期切换（事件委托，内容显示后才生效）
        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('kline-period')) {
                document.querySelectorAll('.kline-period').forEach(b => {
                    b.classList.remove('bg-primary-500', 'text-white');
                    b.classList.add('bg-gray-100', 'text-gray-600');
                });
                e.target.classList.add('bg-primary-500', 'text-white');
                e.target.classList.remove('bg-gray-100', 'text-gray-600');
                loadKline(e.target.dataset.period);
            }
        });
    });

    // 加载全部数据
    async function loadAllData() {
        try {
            const [quote, score, kline] = await Promise.all([
                fetch(`/api/stock/${STOCK_CODE}/quote`).then(r => r.json()),
                fetch(`/api/stock/${STOCK_CODE}/score`).then(r => r.json()),
                fetch(`/api/stock/${STOCK_CODE}/kline?period=daily&count=60`).then(r => r.json())
            ]);

            // 缓存数据供图表初始化使用
            window._lastScore = score;
            window._lastKline = kline;

            // 填充头部信息
            if (quote && !quote.error) {
                document.getElementById('stock-name').textContent = `${quote.name || STOCK_CODE} (${STOCK_CODE})`;
                document.getElementById('stock-industry').textContent = quote.industry || '行业信息加载中...';
                
                // 价格滚动动画
                const priceEl = document.getElementById('stock-price');
                const changeEl = document.getElementById('stock-change');
                const targetPrice = quote.price || 0;
                animateNumber(priceEl, targetPrice, 1000, 2);
                
                const change = quote.change?.toFixed(2) || '--';
                const pct = quote.change_pct?.toFixed(2) || '--';
                changeEl.textContent = `${change >= 0 ? '+' : ''}${change} (${pct >= 0 ? '+' : ''}${pct}%)`;
                
                const colorClass = quote.change >= 0 ? 'text-rise' : 'text-fall';
                priceEl.className = `text-3xl font-bold tabular-nums ${colorClass} pulse-${quote.change >= 0 ? 'rise' : 'fall'}`;
                changeEl.className = `text-sm tabular-nums ${colorClass} fade-in`;
            }

            // 填充评分
            if (score && !score.error) {
                // 评分数字滚动动画
                const totalScoreEl = document.getElementById('total-score');
                animateNumber(totalScoreEl, score.total_score, 1000, 2);
                
                const badge = document.getElementById('rating-badge');
                const ratingMap = { 'A+': '优质', 'A': '良好', 'B': '一般', 'C': '较弱' };
                badge.textContent = `评级: ${score.rating || '--'} ${ratingMap[score.rating] || ''}`;
                badge.className = `mt-2 inline-block px-3 py-1 rounded-full text-sm font-semibold fade-in ${
                    score.rating === 'A+' ? 'bg-green-100 text-green-700' :
                    score.rating === 'A' ? 'bg-blue-100 text-blue-700' :
                    score.rating === 'B' ? 'bg-yellow-100 text-yellow-700' :
                    'bg-gray-100 text-gray-500'
                }`;

                // 评分明细淡入
                const breakdown = document.getElementById('score-breakdown');
                if (score.breakdown) {
                    breakdown.innerHTML = `
                        <div class="flex justify-between fade-in" style="animation-delay: 0.1s"><span>基本面</span><span class="font-semibold">${score.breakdown.fundamental_score?.toFixed(1) || '--'}</span></div>
                        <div class="flex justify-between fade-in" style="animation-delay: 0.2s"><span>技术面</span><span class="font-semibold">${score.breakdown.technical_score?.toFixed(1) || '--'}</span></div>
                        <div class="flex justify-between fade-in" style="animation-delay: 0.3s"><span>估值面</span><span class="font-semibold">${score.breakdown.valuation_score?.toFixed(1) || '--'}</span></div>
                        <div class="flex justify-between fade-in" style="animation-delay: 0.4s"><span>资金面</span><span class="font-semibold">${score.breakdown.capital_score?.toFixed(1) || '--'}</span></div>
                        <div class="flex justify-between fade-in" style="animation-delay: 0.5s"><span>行业面</span><span class="font-semibold">${score.breakdown.industry_score?.toFixed(1) || '--'}</span></div>
                        <div class="flex justify-between fade-in" style="animation-delay: 0.6s"><span>成长性</span><span class="font-semibold">${score.breakdown.growth_score?.toFixed(1) || '--'}</span></div>
                    `;
                }

                // 雷达图（在 hideSkeleton 中初始化）
            }

            // K线图
            if (kline && kline.data && kline.data.length > 0) {
                // 显示数据截止时间
                const lastTradeDate = kline.data[kline.data.length - 1].trade_date;
                const dateHint = document.getElementById('data-hint');
                if (lastTradeDate && dateHint) {
                    const year = lastTradeDate.slice(0, 4);
                    const month = parseInt(lastTradeDate.slice(4, 6));
                    const day = parseInt(lastTradeDate.slice(6, 8));
                    dateHint.textContent = `数据截止${year}-${month}-${day}，交易日数据在收盘后60分钟后刷新！`;
                }
            }

            // 隐藏骨架屏，显示内容
            hideSkeleton();

        } catch (err) {
            console.error('加载数据失败:', err);
            hideSkeleton();
            document.getElementById('stock-name').textContent = '数据加载失败';
        }
    }

    // 隐藏骨架屏，显示内容区域
    function hideSkeleton() {
        // 头部
        const headerSkeleton = document.getElementById('header-skeleton');
        const headerContent = document.getElementById('stock-header');
        if (headerSkeleton) headerSkeleton.classList.add('hidden');
        if (headerContent) headerContent.classList.remove('hidden');

        // 评分
        const scoreSkeleton = document.getElementById('score-skeleton');
        const scoreContent = document.getElementById('score-content');
        if (scoreSkeleton) scoreSkeleton.classList.add('hidden');
        if (scoreContent) scoreContent.classList.remove('hidden');

        // K线
        const klineSkeleton = document.getElementById('kline-skeleton');
        const klineContent = document.getElementById('kline-content');
        if (klineSkeleton) klineSkeleton.classList.add('hidden');
        if (klineContent) klineContent.classList.remove('hidden');

        // 初始化图表（内容显示后才能正确初始化）
        setTimeout(() => {
            radarChart = echarts.init(document.getElementById('radar-chart'));
            klineChart = echarts.init(document.getElementById('kline-chart'));
            window.addEventListener('resize', () => { radarChart.resize(); klineChart.resize(); });

            // 重新填充图表数据
            const score = window._lastScore;
            if (score && score.breakdown) {
                radarChart.setOption(Charts.createRadarOption([
                    score.breakdown?.fundamental_score || 0,
                    score.breakdown?.technical_score || 0,
                    score.breakdown?.capital_score || 0,
                    score.breakdown?.valuation_score || 0,
                    score.breakdown?.industry_score || 0
                ]));
            }
            const kline = window._lastKline;
            if (kline && kline.data && kline.data.length > 0) {
                klineChart.setOption(Charts.createKlineOption(kline.data));
            }
        }, 100);
    }

    // 加载 K 线
    async function loadKline(period) {
        try {
            const res = await fetch(`/api/stock/${STOCK_CODE}/kline?period=${period}&count=120`);
            const data = await res.json();
            if (data.data && data.data.length > 0) {
                klineChart.setOption(Charts.createKlineOption(data.data));
            }
        } catch (err) {
            console.error('K线加载失败:', err);
        }
    }

    // 加载 Tab 内容
    async function loadTabContent(tab) {
        const skeleton = document.getElementById('tab-skeleton');
        const body = document.getElementById('tab-body');
        if (skeleton) skeleton.classList.remove('hidden');
        if (body) body.classList.add('hidden');

        try {
            let html = '';
            if (tab === 'fundamental') {
                const res = await fetch(`/api/stock/${STOCK_CODE}/fundamental`);
                const data = await res.json();
                html = renderFundamental(data);
            } else if (tab === 'valuation') {
                const res = await fetch(`/api/stock/${STOCK_CODE}/valuation`);
                const data = await res.json();
                html = renderValuation(data);
            } else if (tab === 'dupont') {
                const res = await fetch(`/api/stock/${STOCK_CODE}/dupont`);
                const data = await res.json();
                html = renderDupont(data);
            } else if (tab === 'technical') {
                const res = await fetch(`/api/stock/${STOCK_CODE}/technical`);
                const data = await res.json();
                html = renderTechnical(data);
            } else if (tab === 'capital') {
                const res = await fetch(`/api/stock/${STOCK_CODE}/capital`);
                const data = await res.json();
                html = renderCapital(data);
            } else if (tab === 'industry') {
                const res = await fetch(`/api/stock/${STOCK_CODE}/industry`);
                const data = await res.json();
                html = renderIndustry(data);
            } else if (tab === 'ai') {
                html = renderAIAnalysis();
            }
            // 添加过渡动画
            body.innerHTML = `<div class="tab-transition">${html}</div>`;
        } catch (err) {
            body.innerHTML = `<div class="text-center py-8 text-red-500">加载失败: ${err.message}</div>`;
        }
        // 切换到内容显示
        if (skeleton) skeleton.classList.add('hidden');
        if (body) body.classList.remove('hidden');
    }

    // 渲染基本面
    function renderFundamental(data) {
        if (!data || data.error) return '<div class="text-center py-8 text-gray-400">暂无数据</div>';
        const p = data.profitability || {};
        const g = data.growth || {};
        const s = data.solvency || {};
        const c = data.cashflow || {};
        const fmt = (v, unit = '') => v != null ? v.toFixed(2) + unit : '--';
        return `
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">💰 盈利能力</h4>
                <div class="space-y-2 text-xs sm:text-sm">
                    <div class="flex justify-between items-center"><span class="text-gray-500">ROE</span><span class="font-semibold">${fmt(p.roe, '%')}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">净利率</span><span class="font-semibold">${fmt(p.net_margin, '%')}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">EPS</span><span class="font-semibold">${fmt(p.eps, '元')}</span></div>
                </div>
            </div>
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">📈 成长性</h4>
                <div class="space-y-2 text-xs sm:text-sm">
                    <div class="flex justify-between items-center"><span class="text-gray-500">营收同比</span><span class="font-semibold ${g.revenue_yoy >= 0 ? 'text-rise' : 'text-fall'}">${fmt(g.revenue_yoy, '%')}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">利润同比</span><span class="font-semibold ${g.profit_yoy >= 0 ? 'text-rise' : 'text-fall'}">${fmt(g.profit_yoy, '%')}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">连续增长</span><span class="font-semibold">${g.profit_continuous_growth_quarters || 0} 季</span></div>
                </div>
            </div>
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">🏦 偿债能力</h4>
                <div class="space-y-2 text-xs sm:text-sm">
                    <div class="flex justify-between items-center"><span class="text-gray-500">资产负债率</span><span class="font-semibold">${fmt(s.debt_to_assets, '%')}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">流动比率</span><span class="font-semibold">${fmt(s.current_ratio)}</span></div>
                </div>
            </div>
            <div class="bg-gray-50 rounded-lg p-4 md:col-span-2 lg:col-span-3">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">💵 现金流</h4>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-3 sm:gap-4 text-xs sm:text-sm">
                    <div><span class="text-gray-500 block">经营现金流</span><span class="font-semibold">${(c.operating_cashflow || 0).toLocaleString()} 万</span></div>
                    <div><span class="text-gray-500 block">自由现金流</span><span class="font-semibold ${(c.free_cashflow || 0) >= 0 ? 'text-rise' : 'text-fall'}">${(c.free_cashflow || 0).toLocaleString()} 万</span></div>
                    <div><span class="text-gray-500 block">投资现金流</span><span class="font-semibold">${(c.invest_cashflow || 0).toLocaleString()} 万</span></div>
                    <div><span class="text-gray-500 block">现金流覆盖率</span><span class="font-semibold">${fmt(c.cashflow_coverage, '%')}</span></div>
                </div>
            </div>
        </div>`;
    }

    // 渲染估值
    function renderValuation(data) {
        if (!data || data.error) return '<div class="text-center py-8 text-gray-400">暂无数据</div>';
        const v = data.current_valuation || {};
        const p = data.pe_percentile || {};
        const pb = data.pb_percentile || {};
        const fmt = (val, unit = '') => val != null ? val.toFixed(2) + unit : '--';
        const percentileColor = (pct) => pct < 30 ? 'text-fall' : pct > 70 ? 'text-rise' : 'text-yellow-600';
        const percentileLabel = (pct) => pct < 30 ? '低估' : pct > 70 ? '高估' : '合理';
        return `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">📊 当前估值</h4>
                <div class="grid grid-cols-2 gap-3 text-sm">
                    <div class="flex justify-between"><span class="text-gray-500">PE (TTM)</span><span class="font-semibold">${fmt(v.pe_ttm)}</span></div>

    // 渲染技术面
    function renderTechnical(data) {
        if (!data || data.error) return '<div class="text-center py-8 text-gray-400">暂无数据</div>';

        const ma = data.ma || {};
        const macd = data.macd || {};
        const kdj = data.kdj || {};
        const rsi = data.rsi || {};
        const boll = data.boll || {};

        const score = data.score || {};

        // 信号颜色映射

            if (['strong_buy', 'buy'].includes(action)) return 'text-rise bg-red-50';
            if (['strong_sell', 'sell'].includes(action)) return 'text-fall bg-green-50';
            return 'text-yellow-600 bg-yellow-50';
        };

        const signalText = {
            'strong_buy': '强烈看多',
            'buy': '偏多',

        // 排列状态

        // 区域状态

                <h4 class="text-sm font-semibold text-gray-600 mb-3">🎯 筹码分布</h4>
                <div class="space-y-2 text-xs sm:text-sm">
                    <div class="flex justify-between items-center"><span class="text-gray-500">当前价格</span><span class="font-semibold tabular-nums">${fmt(chipDist.current_price)}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">60日高点</span><span class="font-semibold tabular-nums text-rise">${fmt(chipDist.high_60d)}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">60日低点</span><span class="font-semibold tabular-nums text-fall">${fmt(chipDist.low_60d)}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">平均成本</span><span class="font-semibold tabular-nums">${fmt(chipDist.avg_cost)}</span></div>
                    <div class="border-t pt-2 mt-2">
                        <div class="flex justify-between items-center"><span class="text-gray-500">获利盘</span><span class="font-semibold tabular-nums text-rise">${fmt(chipDist.profit_ratio, '%')}</span></div>
                        <div class="flex justify-between items-center"><span class="text-gray-500">套牢盘</span><span class="font-semibold tabular-nums text-fall">${fmt(chipDist.loss_ratio, '%')}</span></div>
                    </div>
                </div>
            </div>
            ` : `
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">🎯 筹码分布</h4>
                <div class="text-center py-8 text-gray-400 text-xs sm:text-sm">暂无数据</div>
            </div>
            `}
        </div>
        `;
    }

    // 渲染行业面
    function renderIndustry(data) {
        if (!data || data.error) return '<div class="text-center py-8 text-gray-400">暂无数据</div>';
        
        const industryInfo = data.industry_info || {};
        const peerComparison = data.peer_comparison || {};
        const industryTrend = data.industry_trend || {};
        const conceptTags = data.concept_tags || {};
        const industryScore = data.industry_score || {};
        
        const fmt = (v, unit = '') => v != null ? (typeof v === 'number' ? v.toFixed(2) + unit : v) : '--';
        
        // 趋势颜色
        const trendColor = (trend) => {
            if (trend === '热门') return 'text-rise';
            if (trend === '冷门') return 'text-fall';
            return 'text-yellow-600';
        };
        
        return `
        <!-- 行业面评分 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
            <div class="bg-gradient-to-br from-blue-50 to-blue-100 rounded-lg p-5 text-center">
                <h4 class="text-sm font-semibold text-blue-700 mb-2">行业面评分</h4>
                <div class="text-2xl sm:text-3xl font-bold text-blue-900">${fmt(industryScore.total)}</div>
                <div class="text-xs sm:text-sm text-blue-600 mt-1">${industryScore.rating || '--'}</div>
            </div>
            <div class="bg-gradient-to-br from-green-50 to-green-100 rounded-lg p-5 text-center">
                <h4 class="text-sm font-semibold text-green-700 mb-2">所属行业</h4>
                <div class="text-xl sm:text-2xl font-bold text-green-900">${industryInfo.industry_name || '--'}</div>
                <div class="text-xs sm:text-sm text-green-600 mt-1">${industryInfo.market_position || '--'}</div>
            </div>
            <div class="bg-gradient-to-br from-purple-50 to-purple-100 rounded-lg p-5 text-center">
                <h4 class="text-sm font-semibold text-purple-700 mb-2">行业趋势</h4>
                <div class="text-xl sm:text-2xl font-bold text-purple-900 ${trendColor(industryTrend.trend)}">${industryTrend.trend || '--'}</div>
                <div class="text-xs sm:text-sm text-purple-600 mt-1">关注度 ${fmt(industryTrend.market_attention)}</div>
            </div>
        </div>

        <!-- 行业详情 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- 行业特征 -->
            ${industryInfo.available ? `
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">🏭 行业特征</h4>
                <div class="space-y-2 text-xs sm:text-sm">
                    <div class="flex justify-between items-center"><span class="text-gray-500">行业名称</span><span class="font-semibold">${industryInfo.industry_name || '--'}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">行业描述</span><span class="font-semibold">${industryInfo.industry_desc || '--'}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">行业权重</span><span class="font-semibold tabular-nums">${fmt(industryInfo.industry_weight)}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">市场地位</span><span class="font-semibold">${industryInfo.market_position || '--'}</span></div>
                </div>
            </div>
            ` : `
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">🏭 行业特征</h4>
                <div class="text-center py-8 text-gray-400 text-xs sm:text-sm">暂无数据</div>
            </div>
            `}

            <!-- 行业内对比 -->
            ${peerComparison.available ? `
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">📊 行业内对比 (共 ${peerComparison.peer_count} 家)</h4>
                <div class="space-y-2 text-xs sm:text-sm">
                    <div class="flex justify-between items-center"><span class="text-gray-500">PE排名</span><span class="font-semibold">第 ${peerComparison.pe_rank} 名 (${fmt(peerComparison.pe_percentile, '%')})</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">PB排名</span><span class="font-semibold">第 ${peerComparison.pb_rank} 名 (${fmt(peerComparison.pb_percentile, '%')})</span></div>
                    <div class="flex justify-between items-center border-t pt-2 mt-2"><span class="text-gray-500">当前PE</span><span class="font-semibold tabular-nums">${fmt(peerComparison.current.pe)}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">当前PB</span><span class="font-semibold tabular-nums">${fmt(peerComparison.current.pb)}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">总市值</span><span class="font-semibold tabular-nums">${(peerComparison.current.total_mv / 100000000).toFixed(2)}亿</span></div>
                </div>
            </div>
            ` : `
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">📊 行业内对比</h4>
                <div class="text-center py-8 text-gray-400 text-xs sm:text-sm">暂无数据</div>
            </div>
            `}

            <!-- 行业趋势 -->
            ${industryTrend.available ? `
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">📈 行业趋势</h4>
                <div class="space-y-2 text-xs sm:text-sm">
                    <div class="flex justify-between items-center"><span class="text-gray-500">当前趋势</span><span class="font-semibold ${trendColor(industryTrend.trend)}">${industryTrend.trend || '--'}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">趋势描述</span><span class="font-semibold">${industryTrend.trend_desc || '--'}</span></div>
                    <div class="flex justify-between items-center"><span class="text-gray-500">市场关注度</span><span class="font-semibold tabular-nums">${fmt(industryTrend.market_attention)}</span></div>
                </div>
            </div>
            ` : `
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">📈 行业趋势</h4>
                <div class="text-center py-8 text-gray-400 text-xs sm:text-sm">暂无数据</div>
            </div>
            `}

            <!-- 概念标签 -->
            ${conceptTags.available ? `
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">🏷️ 概念标签</h4>
                <div class="flex flex-wrap gap-2 mt-3">
                    ${conceptTags.concepts.map(tag => `
                        <span class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-xs font-medium">${tag}</span>
                    `).join('')}
                </div>
            </div>
            ` : `
            <div class="bg-gray-50 rounded-lg p-4">
                <h4 class="text-sm font-semibold text-gray-600 mb-3">🏷️ 概念标签</h4>
                <div class="text-center py-8 text-gray-400 text-xs sm:text-sm">暂无数据</div>
            </div>
            `}
        </div>
        `;
    }

    // 渲染 AI 分析
    function renderAIAnalysis() {
        return `
        <div class="text-center py-12">
            <div class="mb-6">
                <div class="text-6xl mb-4">🤖</div>
                <h3 class="text-xl font-semibold text-gray-700 mb-2">AI 智能分析</h3>
                <p class="text-gray-500 text-sm mb-6">基于六维评分数据，AI 为您提供专业投资建议</p>
            </div>
            <button id="ai-analyze-btn" class="bg-gradient-to-r from-blue-600 to-indigo-600 text-white px-8 py-3 rounded-lg font-medium hover:from-blue-700 hover:to-indigo-700 transition-all shadow-lg hover:shadow-xl">
                开始 AI 分析
            </button>
            <div id="ai-loading" class="hidden mt-8">
                <div class="inline-block">
                    <div class="w-16 h-16 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin"></div>
                </div>
                <p class="text-gray-600 mt-4 animate-pulse">AI 正在分析中，请稍候...</p>
            </div>
            <div id="ai-result" class="hidden mt-8 text-left max-w-4xl mx-auto"></div>
            <div id="ai-error" class="hidden mt-8 text-red-500"></div>
        </div>
        <script>
        document.getElementById('ai-analyze-btn').addEventListener('click', async function() {
            const btn = this;
            const loading = document.getElementById('ai-loading');
            const result = document.getElementById('ai-result');
            const error = document.getElementById('ai-error');
            
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            loading.classList.remove('hidden');
            result.classList.add('hidden');
            error.classList.add('hidden');
            
            try {
                const res = await fetch(\`/api/stock/\${STOCK_CODE}/ai\`);
                const data = await res.json();
                
                if (data.success) {
                    result.classList.remove('hidden');
                    result.innerHTML = \`
                        <div class="bg-white rounded-lg shadow-lg p-6">
                            <div class="prose prose-sm max-w-none">
                                \${data.analysis.replace(/\\n/g, '<br>')}
                            </div>
                            <div class="mt-6 pt-4 border-t border-gray-200">
                                <p class="text-xs text-gray-400">生成时间：\${new Date().toLocaleString()}</p>
                            </div>
                        </div>
                    \`;
                } else {
                    error.classList.remove('hidden');
                    error.textContent = '分析失败：' + (data.error || '未知错误');
                }
            } catch (err) {
                error.classList.remove('hidden');
                error.textContent = '网络错误：' + err.message;
            } finally {
                loading.classList.add('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
        </script>
        `;
    }
</script>
{% endblock %}
