{% extends "base.html" %}

{% block content %}
<div class="space-y-6">

    <!-- 股票头部信息 -->
    <div class="bg-white rounded-xl shadow-sm p-6">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">{{ stock_code }}</h1>
                <p class="text-sm text-gray-500 mt-1">加载中...</p>
            </div>
            <div class="text-right">
                <div class="text-3xl font-bold tabular-nums text-rise">--</div>
                <div class="text-sm tabular-nums text-rise">-- (--%)</div>
            </div>
        </div>
    </div>

    <!-- 综合评分 + K线图 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">

        <!-- 左: 综合评分 -->
        <div class="bg-white rounded-xl shadow-sm p-5 card-hover">
            <h3 class="text-sm font-semibold text-gray-500 mb-3">综合评分</h3>
            <div class="text-center py-6">
                <div class="text-5xl font-bold gradient-text tabular-nums">--</div>
                <div class="mt-2 inline-block px-3 py-1 rounded-full bg-accent-400/20 text-accent-600 text-sm font-semibold">
                    评级: --
                </div>
            </div>
            <!-- 五维雷达图 -->
            <div id="radar-chart" class="w-full h-48"></div>
        </div>

        <!-- 右: K线图 -->
        <div class="lg:col-span-2 bg-white rounded-xl shadow-sm p-5">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-semibold text-gray-500">K线走势</h3>
                <div class="flex space-x-1">
                    <button class="px-2 py-1 text-xs rounded bg-primary-500 text-white">日K</button>
                    <button class="px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200">周K</button>
                    <button class="px-2 py-1 text-xs rounded bg-gray-100 text-gray-600 hover:bg-gray-200">月K</button>
                </div>
            </div>
            <div id="kline-chart" class="w-full h-80"></div>
        </div>
    </div>

    <!-- 分析维度 Tab -->
    <div class="bg-white rounded-xl shadow-sm">
        <div class="border-b border-gray-200">
            <nav class="flex overflow-x-auto">
                <button class="tab-btn px-5 py-3 text-sm font-medium text-primary-600 border-b-2 border-primary-600 whitespace-nowrap"
                        hx-get="/stock/{{ stock_code }}/fundamental"
                        hx-target="#tab-content"
                        hx-swap="innerHTML">基本面</button>
                <button class="tab-btn px-5 py-3 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap"
                        hx-get="/stock/{{ stock_code }}/technical"
                        hx-target="#tab-content"
                        hx-swap="innerHTML">技术面</button>
                <button class="tab-btn px-5 py-3 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap"
                        hx-get="/stock/{{ stock_code }}/valuation"
                        hx-target="#tab-content"
                        hx-swap="innerHTML">估值面</button>
                <button class="tab-btn px-5 py-3 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap"
                        hx-get="/stock/{{ stock_code }}/capital"
                        hx-target="#tab-content"
                        hx-swap="innerHTML">资金面</button>
                <button class="tab-btn px-5 py-3 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap"
                        hx-get="/stock/{{ stock_code }}/industry"
                        hx-target="#tab-content"
                        hx-swap="innerHTML">行业面</button>
                <button class="tab-btn px-5 py-3 text-sm font-medium text-gray-500 hover:text-gray-700 whitespace-nowrap"
                        hx-get="/stock/{{ stock_code }}/ai"
                        hx-target="#tab-content"
                        hx-swap="innerHTML">🤖 AI分析</button>
            </nav>
        </div>
        <div id="tab-content" class="p-5">
            <p class="text-sm text-gray-400 text-center py-8">选择一个维度开始分析</p>
        </div>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/charts.js"></script>
<script>
    // 初始化图表 (Phase 5 完善)
    document.addEventListener('DOMContentLoaded', function() {
        // 雷达图占位
        const radarChart = echarts.init(document.getElementById('radar-chart'));
        radarChart.setOption({
            radar: {
                indicator: [
                    { name: '基本面', max: 100 },
                    { name: '技术面', max: 100 },
                    { name: '资金面', max: 100 },
                    { name: '估值面', max: 100 },
                    { name: '行业面', max: 100 }
                ],
                shape: 'polygon',
                splitArea: { areaStyle: { color: ['#f8fafc', '#f1f5f9'] } }
            },
            series: [{ type: 'radar', data: [{ value: [0,0,0,0,0], name: '评分', areaStyle: { opacity: 0.2 } }] }]
        });

        // K线图占位
        const klineChart = echarts.init(document.getElementById('kline-chart'));
        klineChart.setOption({
            xAxis: { type: 'category', data: [] },
            yAxis: { type: 'value' },
            series: [{ type: 'candlestick', data: [] }],
            graphic: [{ type: 'text', left: 'center', top: 'center', style: { text: 'K线数据加载中...', fontSize: 14, fill: '#9ca3af' } }]
        });

        // 响应式
        window.addEventListener('resize', () => { radarChart.resize(); klineChart.resize(); });
    });

    // Tab 切换高亮
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('text-primary-600', 'border-b-2', 'border-primary-600');
                b.classList.add('text-gray-500');
            });
            this.classList.add('text-primary-600', 'border-b-2', 'border-primary-600');
            this.classList.remove('text-gray-500');
        });
    });
</script>
{% endblock %}
