{% extends "base.html" %}

{% block content %}
<div class="space-y-6">

    <!-- 搜索区域 -->
    <div class="bg-white rounded-xl shadow-sm p-4 sm:p-6 card-hover">
        <h2 class="text-base sm:text-lg font-bold gradient-text mb-3 sm:mb-4">🔍 搜索股票</h2>
        <div class="relative">
            <input
                type="text"
                id="search-input"
                placeholder="输入股票代码、名称或拼音首字母..."
                class="w-full px-4 py-3 border border-gray-200 rounded-lg focus:ring-2 focus:ring-primary-500 focus:border-transparent outline-none text-sm"
            >
            <svg class="absolute right-3 top-3.5 w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
        </div>
        <!-- 搜索结果 -->
        <div id="search-results" class="mt-2"></div>
    </div>

    <!-- 快捷入口 -->
    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
        <a href="/watchlist" class="bg-white rounded-xl shadow-sm p-5 card-hover flex items-center space-x-3">
            <span class="text-3xl">⭐</span>
            <div>
                <h3 class="font-semibold text-gray-800">自选股</h3>
                <p class="text-xs text-gray-500">管理关注的股票</p>
            </div>
        </a>
        <a href="/compare" class="bg-white rounded-xl shadow-sm p-5 card-hover flex items-center space-x-3">
            <span class="text-3xl">⚔️</span>
            <div>
                <h3 class="font-semibold text-gray-800">对比PK</h3>
                <p class="text-xs text-gray-500">横向对比多只股票</p>
            </div>
        </a>
        <a href="/broker" class="bg-white rounded-xl shadow-sm p-5 card-hover flex items-center space-x-3">
            <span class="text-3xl">🏆</span>
            <div>
                <h3 class="font-semibold text-gray-800">金股池</h3>
                <p class="text-xs text-gray-500">查看机构推荐股票</p>
            </div>
        </a>
        <div class="bg-white rounded-xl shadow-sm p-5 card-hover flex items-center space-x-3">
            <span class="text-3xl">🤖</span>
            <div>
                <h3 class="font-semibold text-gray-800">AI 分析</h3>
                <p class="text-xs text-gray-500">输入股票代码深度分析</p>
            </div>
        </div>
    </div>

    <!-- 自选股列表 -->
    <div class="bg-white rounded-xl shadow-sm p-4 sm:p-6 card-hover">
        <h2 class="text-base sm:text-lg font-bold gradient-text mb-3 sm:mb-4">⭐ 我的自选</h2>
        <div id="watchlist-container"
             hx-get="/api/watchlist"
             hx-trigger="load"
             hx-swap="innerHTML"
             hx-indicator="#watchlist-loading">
            <!-- 骨架屏加载动画 -->
            <div id="watchlist-loading" class="space-y-3">
                <div class="animate-pulse">
                    <div class="h-16 bg-gray-100 rounded-lg"></div>
                </div>
                <div class="animate-pulse">
                    <div class="h-16 bg-gray-100 rounded-lg"></div>
                </div>
                <div class="animate-pulse">
                    <div class="h-16 bg-gray-100 rounded-lg"></div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
// 搜索功能
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('search-input');
    const searchResults = document.getElementById('search-results');
    let searchTimeout = null;

    if (searchInput) {
        searchInput.addEventListener('input', function() {
            clearTimeout(searchTimeout);
            const query = this.value.trim();
            
            if (!query) {
                searchResults.innerHTML = '';
                return;
            }
            
            searchTimeout = setTimeout(async () => {
                try {
                    const response = await fetch(`/api/search?q=${encodeURIComponent(query)}`);
                    const data = await response.json();
                    
                    if (data.results && data.results.length > 0) {
                        searchResults.innerHTML = data.results.map(stock => `
                            <a href="/stock/${stock.code}" class="block search-result p-2 hover:bg-gray-100 rounded no-underline text-gray-900">
                                <div class="font-semibold">${stock.name}</div>
                                <div class="text-sm text-gray-600">${stock.code} · ${stock.industry || ''}</div>
                            </a>
                        `).join('');
                    } else {
                        searchResults.innerHTML = '<div class="p-2 text-gray-500">未找到匹配结果</div>';
                    }
                } catch (error) {
                    console.error('搜索失败:', error);
                    searchResults.innerHTML = '<div class="p-2 text-red-500">搜索失败，请重试</div>';
                }
            }, 300);
        });
    }
});
</script>
{% endblock %}
