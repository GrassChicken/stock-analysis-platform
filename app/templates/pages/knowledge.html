{% extends "base.html" %}

{% block content %}
<div class="fade-in">
    <!-- 页面标题 -->
    <div class="mb-6 sm:mb-8">
        <div class="flex flex-col sm:flex-row sm:items-end sm:justify-between gap-3">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold gradient-text mb-1">📖 股票指标百科</h1>
                <p class="text-gray-600 text-sm">新手必读 · 快速掌握股票分析核心指标</p>
            </div>
            <button id="graph-toggle" class="btn-press self-start sm:self-auto px-4 py-2 bg-gradient-to-r from-primary-600 to-primary-700 text-white text-sm font-medium rounded-lg shadow hover:shadow-md transition flex items-center gap-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                关联图谱
            </button>
        </div>
    </div>

    <!-- 搜索框 -->
    <div class="mb-6">
        <div class="relative max-w-xl">
            <input id="search-input" type="text" placeholder="搜索指标名称、符号（如 PE、ROE、MACD...）"
                   class="w-full pl-10 pr-10 py-3 rounded-xl border border-gray-200 bg-white shadow-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent text-sm sm:text-base"
                   autocomplete="off" />
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
            </span>
            <button id="search-clear" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 hidden">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div id="search-result-hint" class="mt-2 text-sm text-gray-500 hidden"></div>
    </div>

    <!-- 主容器 -->
    <div class="flex flex-col lg:flex-row gap-6">
        <!-- 左侧分类导航 -->
        <aside class="lg:w-64 flex-shrink-0">
            <div class="bg-white rounded-xl shadow-sm p-4 lg:sticky lg:top-6">
                <!-- 我的收藏 -->
                <div id="favorites-section" class="mb-4 hidden">
                    <a href="#" id="favorites-nav" class="flex items-center justify-between px-3 py-2 rounded-lg text-sm font-medium text-amber-600 bg-amber-50 hover:bg-amber-100 transition nav-category" data-category="__favorites__">
                        <span>⭐ 我的收藏</span>
                        <span id="favorites-count" class="text-xs bg-amber-200 text-amber-700 px-1.5 py-0.5 rounded-full">0</span>
                    </a>
                    <div class="mt-1 ml-3 space-y-0.5" id="favorites-list">
                    </div>
                </div>

                <h3 class="font-bold text-gray-700 mb-3 text-sm">📑 指标分类</h3>
                <nav id="category-nav" class="space-y-1"></nav>
                <div class="mt-4 pt-4 border-t border-gray-100 flex items-center justify-between">
                    <div class="text-xs text-gray-400">共 <span id="total-count" class="font-bold text-primary-600">0</span> 个指标</div>
                    <button id="favorites-toggle" class="text-xs text-gray-400 hover:text-amber-500 transition flex items-center gap-1">
                        <span>⭐</span>
                        <span id="favorites-toggle-text">显示收藏</span>
                    </button>
                </div>
            </div>
        </aside>

        <!-- 右侧内容区 -->
        <main class="flex-1 min-w-0">
            <div id="indicators-container" class="space-y-8"></div>
            <div id="empty-state" class="hidden text-center py-16">
                <div class="text-6xl mb-4">🔍</div>
                <p class="text-gray-500 text-lg">没有找到匹配的指标</p>
                <p class="text-gray-400 text-sm mt-2">换个关键词试试？</p>
            </div>
            <div id="favorites-empty" class="hidden text-center py-16">
                <div class="text-6xl mb-4">⭐</div>
                <p class="text-gray-500 text-lg">还没有收藏指标</p>
                <p class="text-gray-400 text-sm mt-2">点击指标卡片右上角的 ⭐ 收藏常用指标</p>
            </div>
        </main>
    </div>
</div>

<!-- 关联图谱弹窗 -->
<div id="graph-overlay" class="hidden fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-5xl flex flex-col overflow-hidden" style="max-height: 90vh;">
        <div class="flex items-center justify-between px-6 py-4 border-b border-gray-200">
            <div>
                <h2 class="text-lg font-bold text-gray-800">🔗 指标关联图谱</h2>
                <p class="text-xs text-gray-500 mt-0.5">点击节点查看详情 · 拖拽移动 · 滚轮缩放</p>
            </div>
            <button id="graph-close" class="p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-lg transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <div class="px-6 py-2 flex items-center gap-4 text-xs border-b border-gray-100">
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span> 基本面</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-green-500 inline-block"></span> 技术面</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span> 资金面</span>
            <span class="flex items-center gap-1"><span class="w-3 h-3 rounded-full bg-purple-500 inline-block"></span> 行业面</span>
        </div>
        <div id="graph-canvas-container" style="height: 600px; position: relative; background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);">
            <canvas id="graph-canvas" style="width: 100%; height: 100%; cursor: grab; touch-action: none;"></canvas>
        </div>
        <div class="px-6 py-3 border-t border-gray-200 bg-gray-50 flex items-center justify-between">
            <div id="graph-node-info" class="text-sm text-gray-500">点击节点查看指标详情</div>
            <button id="graph-jump" class="hidden px-3 py-1.5 text-sm bg-primary-600 text-white rounded-lg hover:bg-primary-700 transition">
                查看指标详情 →
            </button>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// 全局状态
let indicatorsData = null;
let allIndicators = [];
let favorites = new Set();
let isFavoritesView = false;

const FAVORITES_KEY = 'knowledge-favorites';

// ========== 收藏功能 ==========
function loadFavorites() {
    try {
        const stored = localStorage.getItem(FAVORITES_KEY);
        if (stored) favorites = new Set(JSON.parse(stored));
    } catch (e) {}
}

function saveFavorites() {
    localStorage.setItem(FAVORITES_KEY, JSON.stringify([...favorites]));
}

function toggleFavorite(id) {
    if (favorites.has(id)) favorites.delete(id);
    else favorites.add(id);
    saveFavorites();
    updateFavoritesUI();
    if (isFavoritesView) filterFavoritesView();
}

function isFavorited(id) { return favorites.has(id); }

function updateFavoritesUI() {
    const section = document.getElementById('favorites-section');
    const countEl = document.getElementById('favorites-count');
    const listEl = document.getElementById('favorites-list');

    if (favorites.size > 0) {
        section.classList.remove('hidden');
        countEl.textContent = favorites.size;
        let html = '';
        favorites.forEach(id => {
            const ind = allIndicators.find(i => i.id === id);
            if (ind) html += `<a href="#indicator-${id}" class="fav-link block px-3 py-1.5 rounded text-xs text-gray-600 hover:bg-amber-50 transition">${ind.symbol} ${ind.name}</a>`;
        });
        listEl.innerHTML = html;
        listEl.querySelectorAll('.fav-link').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                if (isFavoritesView) exitFavoritesView();
                clearSearch();
                const target = document.getElementById('indicator-' + link.dataset.target);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                    target.classList.add('ring-2', 'ring-amber-400');
                    setTimeout(() => target.classList.remove('ring-2', 'ring-amber-400'), 2000);
                }
            });
        });
    } else {
        section.classList.add('hidden');
    }
}

function enterFavoritesView() {
    isFavoritesView = true;
    document.getElementById('favorites-toggle-text').textContent = '显示全部';
    filterFavoritesView();
}

function exitFavoritesView() {
    isFavoritesView = false;
    document.getElementById('favorites-toggle-text').textContent = '显示收藏';
    document.querySelectorAll('.indicator-card').forEach(c => c.classList.remove('hidden'));
    document.querySelectorAll('.category-section').forEach(s => s.classList.remove('hidden'));
    document.getElementById('favorites-empty').classList.add('hidden');
    document.getElementById('indicators-container').classList.remove('hidden');
}

function filterFavoritesView() {
    let count = 0;
    document.querySelectorAll('.indicator-card').forEach(card => {
        const isFav = favorites.has(card.dataset.id);
        card.classList.toggle('hidden', !isFav);
        if (isFav) count++;
    });
    if (count === 0) {
        document.getElementById('indicators-container').classList.add('hidden');
        document.getElementById('favorites-empty').classList.remove('hidden');
    }
}

// ========== 数据加载 ==========
async function loadIndicators() {
    loadFavorites();
    try {
        const res = await fetch('/static/data/indicators.json');
        indicatorsData = await res.json();
        flattenIndicators();
        renderContent();
        document.getElementById('total-count').textContent = allIndicators.length;
        updateFavoritesUI();
    } catch (e) {
        document.getElementById('indicators-container').innerHTML = '<div class="bg-red-50 p-6 rounded-lg text-center text-red-600">加载失败，请刷新</div>';
    }
}

function flattenIndicators() {
    allIndicators = [];
    Object.entries(indicatorsData).forEach(([key, cat]) => {
        cat.categories.forEach(sub => {
            sub.items.forEach(item => {
                allIndicators.push({ ...item, categoryKey: key, categoryName: cat.name });
            });
        });
    });
}

// ========== 渲染 ==========
function renderContent() {
    const nav = document.getElementById('category-nav');
    const content = document.getElementById('indicators-container');
    let navHTML = '', contentHTML = '';

    Object.entries(indicatorsData).forEach(([key, cat]) => {
        let count = cat.categories.reduce((sum, sub) => sum + sub.items.length, 0);
        navHTML += `<a href="#category-${key}" class="flex justify-between px-3 py-2 rounded-lg text-sm text-gray-600 hover:bg-primary-50 nav-cat" data-cat="${key}"><span>${cat.icon} ${cat.name}</span><span class="text-xs bg-gray-100 px-1.5 rounded-full">${count}</span></a>`;
        contentHTML += `<section id="category-${key}" class="category-section mb-8"><h2 class="text-xl font-bold mb-4">${cat.icon} ${cat.name}</h2>`;
        cat.categories.forEach(sub => {
            contentHTML += `<div class="mb-6"><h3 class="text-sm font-semibold text-gray-500 mb-3">${sub.name}</h3><div class="space-y-4">`;
            sub.items.forEach(item => contentHTML += renderCard(item));
            contentHTML += '</div></div>';
        });
        contentHTML += '</section>';
    });

    nav.innerHTML = navHTML;
    content.innerHTML = contentHTML;
    bindRelatedLinks();
    bindFavoriteButtons();
}

function renderCard(ind) {
    const isFav = isFavorited(ind.id);
    const warnings = (ind.warnings || []).map(w => `<li class="flex gap-2 text-sm"><span class="text-orange-500">⚠️</span><span>${w}</span></li>`).join('');
    const related = ind.related && ind.related.length ? `<div class="mt-4 pt-4 border-t"><span class="text-xs text-gray-500">🔗 相关：</span>${ind.related.map(id => { const r = allIndicators.find(i => i.id === id); return r ? `<a href="#indicator-${id}" class="related-link inline-block ml-2 px-2 py-1 text-xs bg-primary-50 text-primary-600 rounded" data-target="${id}">${r.name}(${r.symbol})</a>` : ''; }).join('')}</div>` : '';

    return `<div id="indicator-${ind.id}" class="indicator-card bg-white rounded-xl shadow-sm border p-5 card-hover" data-id="${ind.id}" data-search="${ind.name} ${ind.symbol} ${ind.meaning}">
        <div class="flex justify-between items-start mb-4">
            <div><h3 class="text-lg font-bold">${ind.name}</h3><span class="inline-block mt-1 px-2 py-0.5 text-xs font-mono bg-gray-100 rounded">${ind.symbol}</span></div>
            <button class="fav-btn text-2xl ${isFav ? 'text-amber-400' : 'text-gray-300'}" data-id="${ind.id}">${isFav ? '★' : '☆'}</button>
        </div>
        <div class="mb-4"><div class="text-xs text-gray-500 mb-1">📐 公式</div><div class="bg-blue-50 rounded p-3"><code class="text-sm text-blue-900 whitespace-pre-line">${ind.formula}</code></div></div>
        <div class="mb-4"><div class="text-xs text-gray-500 mb-1"> 含义</div><p class="text-sm">${ind.meaning}</p></div>
        <div class="mb-4"><div class="text-xs text-gray-500 mb-2">📊 参考区间</div><div class="grid grid-cols-3 gap-2">
            <div class="bg-green-50 rounded p-2"><div class="text-xs text-green-600 font-medium">✅ 低估</div><div class="text-xs">${ind.reference.low}</div></div>
            <div class="bg-yellow-50 rounded p-2"><div class="text-xs text-yellow-600 font-medium">⚖️ 合理</div><div class="text-xs">${ind.reference.mid}</div></div>
            <div class="bg-red-50 rounded p-2"><div class="text-xs text-red-600 font-medium"> 高估</div><div class="text-xs">${ind.reference.high}</div></div>
        </div></div>
        ${warnings ? `<div class="mb-4"><div class="text-xs text-gray-500 mb-2">️ 注意事项</div><ul class="space-y-1">${warnings}</ul></div>` : ''}
        ${ind.example ? `<div class="mb-2"><div class="text-xs text-gray-500 mb-1"> 示例</div><div class="bg-purple-50 rounded p-3"><p class="text-sm text-purple-900">${ind.example}</p></div></div>` : ''}
        ${related}
    </div>`;
}

function getIndicatorName(id) { const f = allIndicators.find(i => i.id === id); return f ? `${f.name}(${f.symbol})` : id; }

function bindRelatedLinks() {
    document.querySelectorAll('.related-link').forEach(link => {
        link.addEventListener('click', (e) => {
            e.preventDefault();
            if (isFavoritesView) exitFavoritesView();
            clearSearch();
            const target = document.getElementById('indicator-' + link.dataset.target);
            if (target) {
                target.scrollIntoView({ behavior: 'smooth' });
                target.classList.add('ring-2', 'ring-primary-500');
                setTimeout(() => target.classList.remove('ring-2', 'ring-primary-500'), 2000);
            }
        });
    });
}

function bindFavoriteButtons() {
    document.querySelectorAll('.fav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.dataset.id;
            toggleFavorite(id);
            const nowFav = isFavorited(id);
            btn.textContent = nowFav ? '★' : '☆';
            btn.className = `fav-btn text-2xl ${nowFav ? 'text-amber-400' : 'text-gray-300'}`;
            btn.style.transform = 'scale(1.3)';
            setTimeout(() => btn.style.transform = '', 200);
        });
    });
}

// ========== 搜索 ==========
const searchInput = document.getElementById('search-input');
const searchClear = document.getElementById('search-clear');
let searchTimeout;

searchInput.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => performSearch(searchInput.value.trim()), 200);
    searchClear.classList.toggle('hidden', !searchInput.value);
});

searchClear.addEventListener('click', () => { clearSearch(); searchInput.focus(); });
document.addEventListener('keydown', (e) => { if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); searchInput.focus(); } });

function clearSearch() {
    searchInput.value = '';
    searchClear.classList.add('hidden');
    document.getElementById('search-result-hint').classList.add('hidden');
    document.querySelectorAll('.indicator-card').forEach(c => c.classList.remove('hidden'));
    document.querySelectorAll('.category-section').forEach(s => s.classList.remove('hidden'));
}

function performSearch(query) {
    if (!query) { clearSearch(); return; }
    if (isFavoritesView) exitFavoritesView();
    const q = query.toLowerCase();
    let count = 0;
    document.querySelectorAll('.indicator-card').forEach(card => {
        const match = card.dataset.search.toLowerCase().includes(q);
        card.classList.toggle('hidden', !match);
        if (match) count++;
    });
    const hint = document.getElementById('search-result-hint');
    hint.classList.remove('hidden');
    hint.textContent = count > 0 ? `找到 ${count} 个指标` : `未找到"${query}"`;
}

document.getElementById('favorites-toggle').addEventListener('click', () => {
    if (isFavoritesView) exitFavoritesView(); else { clearSearch(); enterFavoritesView(); }
});

document.getElementById('favorites-nav').addEventListener('click', (e) => {
    e.preventDefault();
    if (isFavoritesView) exitFavoritesView(); else { clearSearch(); enterFavoritesView(); }
});

// ========== 关联图谱 ==========
const categoryColors = { fundamental: '#3b82f6', technical: '#22c55e', money_flow: '#f59e0b', industry: '#a855f7' };

let graphNodes = [];
let graphEdges = [];
let graphAnimFrame = null;
let graphDragging = null;
let graphSelected = null;
let graphScale = 1;
let graphPan = { x: 0, y: 0 };
let graphDraggingCanvas = false;
let graphLastMouse = { x: 0, y: 0 };

function getConnections(id) { return graphEdges.filter(e => e.source === id || e.target === id); }

function initGraph() {
    graphNodes = [];
    graphEdges = [];
    
    // 创建节点（圆形分布）
    allIndicators.forEach((ind, i) => {
        const angle = (i / allIndicators.length) * Math.PI * 2;
        const radius = 100 + (i % 3) * 50;
        graphNodes.push({
            id: ind.id,
            name: ind.name,
            symbol: ind.symbol,
            category: ind.categoryKey,
            x: Math.cos(angle) * radius,
            y: Math.sin(angle) * radius,
            vx: 0, vy: 0,
            radius: 18 + Math.min(getConnections(ind.id).length * 2, 12)
        });
    });

    // 创建边
    const edgeSet = new Set();
    allIndicators.forEach(ind => {
        if (ind.related) {
            ind.related.forEach(rid => {
                if (allIndicators.find(i => i.id === rid)) {
                    const key = [ind.id, rid].sort().join('-');
                    if (!edgeSet.has(key)) { edgeSet.add(key); graphEdges.push({ source: ind.id, target: rid }); }
                }
            });
        }
    });
}

function startGraph() {
    const canvas = document.getElementById('graph-canvas');
    const ctx = canvas.getContext('2d');
    
    // 设置 Canvas 尺寸
    function resize() {
        const container = document.getElementById('graph-canvas-container');
        const w = container.clientWidth;
        const h = container.clientHeight;
        canvas.width = w * 2;
        canvas.height = h * 2;
        canvas.style.width = w + 'px';
        canvas.style.height = h + 'px';
        ctx.scale(2, 2);
    }
    
    resize();
    window.addEventListener('resize', resize);
    
    // 力导向
    function simulate() {
        graphNodes.forEach((a, i) => {
            // 斥力
            graphNodes.slice(i + 1).forEach(b => {
                const dx = a.x - b.x, dy = a.y - b.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                const force = 500 / (dist * dist);
                a.vx += (dx / dist) * force * 0.1;
                a.vy += (dy / dist) * force * 0.1;
                b.vx -= (dx / dist) * force * 0.1;
                b.vy -= (dy / dist) * force * 0.1;
            });
        });
        
        // 引力
        graphEdges.forEach(edge => {
            const a = graphNodes.find(n => n.id === edge.source);
            const b = graphNodes.find(n => n.id === edge.target);
            if (a && b) {
                const dx = b.x - a.x, dy = b.y - a.y;
                const dist = Math.sqrt(dx * dx + dy * dy) || 1;
                const force = dist * 0.01;
                a.vx += dx * force; a.vy += dy * force;
                b.vx -= dx * force; b.vy -= dy * force;
            }
        });
        
        // 中心引力 + 更新
        graphNodes.forEach(node => {
            if (node === graphDragging) return;
            node.vx -= node.x * 0.02;
            node.vy -= node.y * 0.02;
            node.vx *= 0.9; node.vy *= 0.9;
            node.x += node.vx; node.y += node.vy;
        });
    }

    function draw() {
        const w = canvas.width / 2;
        const h = canvas.height / 2;
        ctx.clearRect(0, 0, w, h);
        
        ctx.save();
        ctx.translate(w / 2 + graphPan.x, h / 2 + graphPan.y);
        ctx.scale(graphScale, graphScale);

        // 边
        graphEdges.forEach(edge => {
            const a = graphNodes.find(n => n.id === edge.source);
            const b = graphNodes.find(n => n.id === edge.target);
            if (!a || !b) return;
            const highlight = graphSelected && (edge.source === graphSelected.id || edge.target === graphSelected.id);
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = highlight ? '#3b82f6' : 'rgba(200,200,200,0.5)';
            ctx.lineWidth = highlight ? 2 : 1;
            ctx.stroke();
        });

        // 节点
        graphNodes.forEach(node => {
            const color = categoryColors[node.category] || '#6b7280';
            const r = node.radius;
            const dimmed = graphSelected && graphSelected !== node && !graphEdges.some(e => (e.source === graphSelected.id && e.target === node.id) || (e.target === graphSelected.id && e.source === node.id));
            
            ctx.beginPath();
            ctx.arc(node.x, node.y, r, 0, Math.PI * 2);
            ctx.fillStyle = dimmed ? '#d1d5db' : color;
            ctx.globalAlpha = dimmed ? 0.4 : 1;
            ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();
            
            ctx.fillStyle = dimmed ? '#9ca3af' : '#fff';
            ctx.font = 'bold 9px system-ui';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(node.symbol.substring(0, 7), node.x, node.y);
            ctx.globalAlpha = 1;
            
            if (graphSelected === node || graphEdges.some(e => (e.source === graphSelected?.id && e.target === node.id) || (e.target === graphSelected?.id && e.source === node.id))) {
                ctx.fillStyle = '#374151';
                ctx.font = 'bold 11px system-ui';
                ctx.fillText(node.name, node.x, node.y + r + 12);
            }
        });

        ctx.restore();
        simulate();
        graphAnimFrame = requestAnimationFrame(draw);
    }

    draw();

    // 交互
    function getPos(e) {
        const rect = canvas.getBoundingClientRect();
        const w = canvas.width / 2, h = canvas.height / 2;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
            x: (clientX - rect.left - w / 2 - graphPan.x) / graphScale,
            y: (clientY - rect.top - h / 2 - graphPan.y) / graphScale
        };
    }

    function findNode(pos) {
        for (let i = graphNodes.length - 1; i >= 0; i--) {
            const n = graphNodes[i];
            const dx = pos.x - n.x, dy = pos.y - n.y;
            if (dx * dx + dy * dy < n.radius * n.radius) return n;
        }
        return null;
    }

    function onDown(e) {
        e.preventDefault();
        const pos = getPos(e);
        const node = findNode(pos);
        if (node) { graphDragging = node; graphSelected = node; updateInfo(node); }
        else { graphDraggingCanvas = true; graphLastMouse = { x: e.touches ? e.touches[0].clientX : e.clientX, y: e.touches ? e.touches[0].clientY : e.clientY }; }
    }

    function onMove(e) {
        e.preventDefault();
        if (graphDragging) {
            const pos = getPos(e);
            graphDragging.x = pos.x; graphDragging.y = pos.y;
            graphDragging.vx = 0; graphDragging.vy = 0;
        } else if (graphDraggingCanvas) {
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            graphPan.x += cx - graphLastMouse.x; graphPan.y += cy - graphLastMouse.y;
            graphLastMouse = { x: cx, y: cy };
        }
    }

    function onUp() { graphDragging = null; graphDraggingCanvas = false; }

    canvas.addEventListener('mousedown', onDown);
    canvas.addEventListener('mousemove', onMove);
    canvas.addEventListener('mouseup', onUp);
    canvas.addEventListener('mouseleave', onUp);
    canvas.addEventListener('touchstart', onDown, { passive: false });
    canvas.addEventListener('touchmove', onMove, { passive: false });
    canvas.addEventListener('touchend', onUp);
    canvas.addEventListener('wheel', (e) => { e.preventDefault(); graphScale = Math.max(0.3, Math.min(3, graphScale * (e.deltaY > 0 ? 0.9 : 1.1))); }, { passive: false });

    function updateInfo(node) {
        const ind = allIndicators.find(i => i.id === node.id);
        if (ind) {
            document.getElementById('graph-node-info').innerHTML = `<strong>${ind.name}(${ind.symbol})</strong> · ${ind.categoryName} · ${getConnections(node.id).length} 个关联`;
            document.getElementById('graph-jump').classList.remove('hidden');
            document.getElementById('graph-jump').onclick = () => {
                closeGraph();
                clearSearch();
                const target = document.getElementById('indicator-' + node.id);
                if (target) { target.scrollIntoView({ behavior: 'smooth' }); target.classList.add('ring-2', 'ring-primary-500'); setTimeout(() => target.classList.remove('ring-2', 'ring-primary-500'), 2000); }
            };
        }
    }
}

function openGraph() {
    document.getElementById('graph-overlay').classList.remove('hidden');
    if (!graphNodes.length) { initGraph(); setTimeout(startGraph, 100); }
    else startGraph();
}

function closeGraph() {
    document.getElementById('graph-overlay').classList.add('hidden');
    document.getElementById('graph-jump').classList.add('hidden');
    if (graphAnimFrame) { cancelAnimationFrame(graphAnimFrame); graphAnimFrame = null; }
}

document.getElementById('graph-toggle').addEventListener('click', openGraph);
document.getElementById('graph-close').addEventListener('click', closeGraph);
document.getElementById('graph-overlay').addEventListener('click', (e) => { if (e.target.id === 'graph-overlay') closeGraph(); });

// 初始化
document.addEventListener('DOMContentLoaded', loadIndicators);
</script>
