{% extends "base.html" %}

{% block content %}
<div class="space-y-4 sm:space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-lg sm:text-2xl font-bold gradient-text">⭐ 我的自选股</h1>
        <a href="/" class="text-xs sm:text-sm text-primary-600 hover:text-primary-800 transition-colors">← 返回首页</a>
    </div>

    <!-- 分组筛选 Tab -->
    <div id="group-tabs" class="flex items-center space-x-2 overflow-x-auto pb-1 scrollbar-hide">
        <!-- 由 JS 动态渲染 -->
    </div>

    <div class="bg-white rounded-xl shadow-sm p-3 sm:p-6 card-hover">
        <div id="watchlist-container"
             hx-get="/api/watchlist"
             hx-trigger="load"
             hx-swap="innerHTML"
             hx-indicator="#watchlist-loading">
            <!-- 骨架屏加载动画 -->
            <div id="watchlist-loading" class="space-y-3">
                <div class="animate-pulse">
                    <div class="h-20 bg-gray-100 rounded-lg"></div>
                </div>
                <div class="animate-pulse">
                    <div class="h-20 bg-gray-100 rounded-lg"></div>
                </div>
                <div class="animate-pulse">
                    <div class="h-20 bg-gray-100 rounded-lg"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
// 等待 HTMX 加载完成后初始化分组 Tab
document.addEventListener('htmx:afterSwap', function(event) {
    if (event.detail.target.id === 'watchlist-container' && typeof initGroupTabs === 'function') {
        initGroupTabs();
    }
});
</script>
{% endblock %}
